[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.20.1",
    "email-validator>=2.3.0",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "ollama>=0.6.3",
    "pandas>=2.3.3",
    "passlib>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.3",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2.0.55",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
enterprise-ai-agent = "app:main"
document-worker = "app.workers.document_worker:main"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
