<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="880" viewBox="0 0 1080 880" role="img" aria-labelledby="title description">
  <title id="title">Company AI LangGraph orchestration</title>
  <desc id="description">The compiled graph plans a request, authorizes the plan, conditionally retrieves documents and executes structured tools, aggregates results, generates a grounded answer, and ends.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arrow-dashed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; fill: #172033; }
      .title { font-size: 27px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #526078; }
      .node { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2; }
      .node-label { font-size: 16px; font-weight: 650; text-anchor: middle; }
      .node-detail { font-size: 12px; fill: #526078; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .conditional { fill: none; stroke: #7c3aed; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#arrow-dashed); }
      .edge-label { font-size: 12px; font-weight: 600; fill: #6d28d9; }
      .terminal { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1080" height="880" fill="#ffffff"/>
  <text class="title" x="48" y="52">Company AI · LangGraph orchestration</text>
  <text class="subtitle" x="48" y="80">Compiled graph structure from app/agents/orchestrator.py</text>

  <ellipse class="terminal" cx="540" cy="122" rx="45" ry="20"/>
  <text class="node-label" x="540" y="127" font-size="13">START</text>
  <path class="edge" d="M540 142 L540 166"/>

  <rect class="node" x="390" y="168" width="300" height="68" rx="12"/>
  <text class="node-label" x="540" y="196">plan</text>
  <text class="node-detail" x="540" y="217">Classify request and select registered tools</text>
  <path class="edge" d="M540 236 L540 274"/>

  <rect class="node" x="390" y="276" width="300" height="70" rx="12"/>
  <text class="node-label" x="540" y="305">authorize_plan</text>
  <text class="node-detail" x="540" y="327">Check access before data execution</text>

  <rect class="node" x="80" y="430" width="300" height="86" rx="12"/>
  <text class="node-label" x="230" y="462">retrieve_documents</text>
  <text class="node-detail" x="230" y="486">Secure RAG retrieval</text>

  <rect class="node" x="700" y="430" width="300" height="86" rx="12"/>
  <text class="node-label" x="850" y="462">execute_structured_tools</text>
  <text class="node-detail" x="850" y="486">Validated registry + tool authorization</text>

  <rect class="node" x="390" y="590" width="300" height="74" rx="12"/>
  <text class="node-label" x="540" y="620">aggregate_results</text>
  <text class="node-detail" x="540" y="642">Validate and bound authorized evidence</text>

  <rect class="node" x="390" y="700" width="300" height="70" rx="12"/>
  <text class="node-label" x="540" y="730">generate_answer</text>
  <text class="node-detail" x="540" y="751">Generate grounded response</text>

  <ellipse class="terminal" cx="540" cy="810" rx="38" ry="20"/>
  <text class="node-label" x="540" y="815" font-size="13">END</text>

  <path class="conditional" d="M455 346 C400 370 320 394 230 429"/>
  <text class="edge-label" x="319" y="380">retrieve</text>
  <path class="conditional" d="M625 346 C680 370 760 394 850 429"/>
  <text class="edge-label" x="721" y="380">execute_tools</text>
  <path class="conditional" d="M540 346 L540 589"/>
  <text class="edge-label" x="552" y="480">aggregate</text>

  <path class="conditional" d="M700 484 L380 484"/>
  <text class="edge-label" x="480" y="507">retrieve (mixed)</text>
  <path class="conditional" d="M275 516 C330 550 415 570 470 589"/>
  <text class="edge-label" x="324" y="563">aggregate</text>
  <path class="conditional" d="M805 516 C750 550 665 570 610 589"/>
  <text class="edge-label" x="695" y="563">aggregate</text>

  <path class="edge" d="M540 664 L540 698"/>
  <path class="edge" d="M540 770 L540 789"/>
  <text class="subtitle" x="48" y="864">Dashed arrows are conditional routes; solid arrows are fixed graph edges.</text>
</svg>
